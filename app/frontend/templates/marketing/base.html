<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{% block meta_description %}Call-Off helps specialist subcontractors plan, coordinate and deliver their products and services more reliably for clients.{% endblock %}"
    />
    <meta name="theme-color" content="#111315" />

    <title>{% block title %}Call-Off{% endblock %}</title>

    <!-- Applies the theme before first paint - see core/theme-init.js.
         Must be an external file, not an inline script: the CSP's
         script-src has no 'unsafe-inline'. -->
    <script src="{{ url_for('static', path='js/core/theme-init.js') }}"></script>

    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', path='assets/favicon.svg') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}" />
  </head>

  <body class="marketing">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include "partials/nav.html" %}

    <main class="marketing-main" id="main-content">
      {% block content %}{% endblock %}
    </main>

    {% include "partials/marketing/footer.html" %}

    <script src="{{ url_for('static', path='js/core/theme-toggle.js') }}"></script>
    <script src="{{ url_for('static', path='js/core/nav-menu.js') }}"></script>
    <script src="{{ url_for('static', path='js/core/smooth-inputs.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
