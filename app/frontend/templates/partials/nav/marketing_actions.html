<div class="theme-control">
  <button
    type="button"
    class="theme-toggle"
    id="theme-toggle"
    aria-label="Switch to dark mode"
    aria-pressed="false"
  >
    {{ inline_svg_asset("theme.svg") }}
  </button>
</div>

<div class="site-nav-menu site-nav-menu-marketing" data-nav-menu-collapse-below="1050">
  <button
    type="button"
    class="site-nav-menu-toggle"
    aria-expanded="false"
    aria-controls="site-nav-menu-panel"
    aria-label="Open navigation actions"
    data-closed-label="Open navigation actions"
    data-open-label="Close navigation actions"
  >
    <span class="site-nav-menu-line"></span>
    <span class="site-nav-menu-line"></span>
    <span class="site-nav-menu-line"></span>
  </button>

  <div
    class="site-nav-menu-panel"
    id="site-nav-menu-panel"
    aria-label="Navigation actions"
  >
    <a href="/login" class="ghost-button">Log in</a>
    <a href="/early-access" class="primary-button">Early Access</a>
  </div>
</div>
