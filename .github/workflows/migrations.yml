name: Migration verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgresql-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: calloff_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d calloff_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run PostgreSQL migration matrix
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/calloff_migration_test
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/calloff_migration_test
          ALLOW_MIGRATION_TEST_DATABASE_RESET: "1"
          ENVIRONMENT: test
        run: python -m unittest tests.test_migrations_postgresql -v
