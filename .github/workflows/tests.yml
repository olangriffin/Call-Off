name: Application regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  application-tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: "sqlite+pysqlite:///:memory:"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run application test suite
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-test-output
          path: test-output.txt
      - name: Compile Python sources
        run: python -m compileall -q app migrations tests
      - name: Check JavaScript syntax
        run: |
          node --check app/frontend/static/js/programme/workspace.js
          node --check app/frontend/static/js/marketing/early-access.js
          node --check app/frontend/static/js/core/nav-menu.js
          node --check app/frontend/static/js/core/smooth-inputs.js
